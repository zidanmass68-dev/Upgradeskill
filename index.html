<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upgradeskill Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
}

header{
text-align:center;
padding:60px 20px 30px;
}

header h1{
font-size:32px;
font-weight:700;
}

header p{
margin-top:10px;
opacity:0.8;
}

.container{
max-width:1100px;
margin:40px auto;
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.card{
background:rgba(255,255,255,0.08);
border-radius:18px;
overflow:hidden;
transition:0.4s ease;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:350px;
object-fit:cover;
}

.card-content{
padding:20px;
}

.card-content h3{
font-size:20px;
margin-bottom:10px;
}

.card-content p{
font-size:14px;
opacity:0.8;
margin-bottom:15px;
}

.btn{
display:inline-block;
padding:10px 18px;
border-radius:10px;
background:linear-gradient(45deg,#ff512f,#dd2476);
color:white;
text-decoration:none;
font-weight:600;
}

footer{
text-align:center;
padding:40px 20px;
font-size:14px;
opacity:0.6;
}
</style>
</head>

<body>

<header>
<h1>🔥 Rekomendasi Produk Premium</h1>
<p>Kurasi produk pilihan berbasis kualitas & nilai fungsional</p>
</header>

<div class="container">

<div class="card">
<img src="https://via.placeholder.com/400x600" alt="Produk 1">
<div class="card-content">
<h3>Madilog</h3>
<p>Buku pemikiran Materialisme, Dialektika, dan Logika karya Tan Malaka.</p>
<a href="https://s.shopee.co.id/5fjb7doD4g" target="_blank" class="btn">Lihat di Shopee</a>
</div>
</div>

</div>

<footer>
© 2026 Upgradeskill Store
</footer>

</body>
  </html>
